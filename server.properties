#Minecraft server properties
#Generated for Professional Hybrid Server (Arclight/Mohist)
#Optimized for ~4GB allocated RAM on 6.5-6.8GB host

# Network
server-port=25565
server-ip=
online-mode=false
max-players=20
network-compression-threshold=256
prevent-proxy-connections=false

# World & Gameplay
level-name=world
level-seed=
level-type=minecraft\:normal
generator-settings={}
difficulty=hard
gamemode=survival
force-gamemode=false
hardcore=false
pvp=true
allow-flight=true
allow-nether=true
enable-command-block=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
generate-structures=true
max-world-size=29999984
max-build-height=256

# Performance (Critical for low RAM)
view-distance=6
simulation-distance=4
entity-broadcast-range-percentage=100
max-tick-time=60000
use-native-transport=true
sync-chunk-writes=true

# Security & Protection
spawn-protection=16
op-permission-level=4
function-permission-level=2
enable-rcon=false
rcon.port=25575
rcon.password=
enable-query=false
query.port=25565
enable-status=true
hide-online-players=false

# Player Experience
motd=\u00A7c\u00A7lPROFESSIONAL HYBRID SERVER \u00A77| \u00A7aMods \& Plugins \u00A77| \u00A7b1.20.4/1.21
player-idle-timeout=30
white-list=false
enforce-whitelist=false
broadcast-rcon-to-ops=true
broadcast-console-to-ops=true

# Resource Pack (optional)
resource-pack=
resource-pack-sha1=
require-resource-pack=false
resource-pack-prompt=

# Other
enable-jmx-monitoring=false
rate-limit=0
text-filtering-config=
initial-enabled-packs=vanilla
initial-disabled-packs=

# Hybrid specific notes:
# - online-mode=false allows cracked + premium players
# - allow-flight=true required for many mods/plugins with flight
# - view-distance=6 + simulation-distance=4 keeps TPS stable on 4GB heap
