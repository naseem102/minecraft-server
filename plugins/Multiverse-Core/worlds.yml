# Multiverse-Core Worlds Configuration
# Generated for Professional Hybrid Server (Arclight 1.21.1)
# Worlds are imported/created on first run or via /mv create

worlds:
  world:
    ==: MVWorld
    hidden: 'false'
    alias: Lobby Hub
    color: GOLD
    style: NORMAL
    pvp: 'false'
    scale: 1.0
